services:
  ros-noetic:
    build: .
    image: tactile-robot:noetic
    container_name: tactile_robot
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./pinocchio_sim_ws/src:/workspace/pinocchio_sim_ws/src:rw
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: /bin/bash
